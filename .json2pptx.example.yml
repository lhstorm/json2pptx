# Example configuration file for json2pptx
# Copy this to .json2pptx.yml and customize as needed

# Theme configuration - applies to all presentations unless overridden in JSON
theme:
  primary_color: '#2C3E50'      # Dark blue-grey
  secondary_color: '#3498DB'    # Bright blue
  accent_color: '#E74C3C'       # Red
  background_color: '#FFFFFF'   # White
  text_color: '#2C3E50'         # Dark blue-grey
  font_family: 'Calibri'        # Font family name

# Output configuration
output:
  default_directory: '.'        # Default output directory
  overwrite: false              # Allow overwriting existing files

# Logging configuration
logging:
  level: 'INFO'                 # DEBUG, INFO, WARNING, ERROR
  format: 'standard'            # 'standard' or 'json'

# Optional: Default metadata for presentations
# (can be overridden in individual JSON files)
# default_metadata:
#   author: 'Your Name'
#   date: '2024'
